[project]
name = "netmonlt"
version = "0.1.0"
description = "Lightweight network monitoring platform with a simulated-device demo mode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.scripts]
netmonlt = "netmonlt.__main__:main"

[project.optional-dependencies]
snmp = [
    "cryptography>=42",
    "pysnmp>=7.1,<8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.0",
    "ruff>=0.6",
    "pysnmp>=7.1,<8",
    "cryptography>=42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netmonlt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
