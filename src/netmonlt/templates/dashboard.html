<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetMonLT</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1b1f24; --muted:#667085; --line:#e4e7ec;
          --up:#067647; --up-bg:#d1fadf; --deg:#93370d; --deg-bg:#fef0c7;
          --down:#b42318; --down-bg:#fee4e2; --none:#475467; --none-bg:#eaecf0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1318; --card:#171c23; --fg:#e6e9ee; --muted:#98a2b3; --line:#2a313b;
            --up:#6ce9a6; --up-bg:#0b3a24; --deg:#fec84b; --deg-bg:#4a2f06;
            --down:#fda29b; --down-bg:#55160f; --none:#cbd5e1; --none-bg:#2a313b; }
  }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--fg);
         font:15px/1.5 system-ui, sans-serif; }
  main { max-width:900px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { color:var(--muted); margin:0 0 16px; }
  .banner { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px;
            font-weight:600; background:var(--deg-bg); color:var(--deg); }
  .banner.live { background:var(--up-bg); color:var(--up); }
  .summary { display:flex; gap:12px; margin:16px 0; flex-wrap:wrap; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:8px;
          padding:8px 16px; min-width:90px; }
  .tile b { display:block; font-size:22px; }
  .tile span { color:var(--muted); font-size:13px; }
  .wrap { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--line);
           white-space:nowrap; }
  th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  tr:last-child td { border-bottom:0; }
  td.num { font-variant-numeric: tabular-nums; }
  .badge { padding:2px 10px; border-radius:999px; font-size:13px; font-weight:600; }
  .up { background:var(--up-bg); color:var(--up); }
  .degraded { background:var(--deg-bg); color:var(--deg); }
  .down { background:var(--down-bg); color:var(--down); }
  .unknown, .stale { background:var(--none-bg); color:var(--none); }
  .wrap.offline { opacity:.5; }
  #error { color:var(--down); font-weight:600; margin:0 0 12px; }
  #error:empty { display:none; }
</style>
</head>
<body>
<main>
  <h1>NetMonLT</h1>
  <p class="sub">
    {% if mode == "simulated" %}<span class="banner">SIMULATED DATA</span>
    {% else %}<span class="banner live">LIVE · ICMP</span>{% endif %}
    <span id="updated">Loading…</span>
  </p>
  <div id="error" role="status"></div>
  <div class="summary" id="summary"></div>
  <div class="wrap">
    <table>
      <thead><tr>
        <th>Status</th><th>Device</th><th>Address</th><th>Type</th>
        <th>Latency</th><th>Loss</th><th>Last check</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
const rows = document.getElementById("rows");
const summary = document.getElementById("summary");
const wrap = document.querySelector(".wrap");

function cell(text, cls) {
  const td = document.createElement("td");
  td.textContent = text;
  if (cls) td.className = cls;
  return td;
}

function render(data) {
  const counts = {up: 0, degraded: 0, down: 0, stale: 0, unknown: 0};
  rows.replaceChildren();
  for (const d of data.devices) {
    // A stale device keeps its last status in the API, but must not look current here.
    const status = d.stale ? "stale" : (d.status || "unknown");
    counts[status] += 1;
    const tr = document.createElement("tr");
    const badgeCell = document.createElement("td");
    const badge = document.createElement("span");
    badge.className = "badge " + status;
    badge.textContent = status;
    badgeCell.appendChild(badge);
    const loss = d.sent ? Math.round(100 * (d.sent - d.received) / d.sent) + "%" : "–";
    // Real LAN replies are often well under 1 ms, so keep two decimals there.
    const rtt = d.rtt_avg_ms == null ? "–"
      : d.rtt_avg_ms.toFixed(d.rtt_avg_ms < 1 ? 2 : 1) + " ms";
    const age = d.age_s == null ? "never" : Math.round(d.age_s) + "s ago";
    tr.append(badgeCell, cell(d.name), cell(d.address), cell(d.type),
              cell(rtt, "num"), cell(loss, "num"), cell(age, "num"));
    rows.appendChild(tr);
  }
  summary.replaceChildren();
  for (const key of ["up", "degraded", "down", "stale", "unknown"]) {
    if (counts[key] === 0 && (key === "stale" || key === "unknown")) continue;
    const tile = document.createElement("div");
    tile.className = "tile";
    const b = document.createElement("b");
    b.textContent = counts[key];
    const s = document.createElement("span");
    s.textContent = key;
    tile.append(b, s);
    summary.appendChild(tile);
  }
  document.getElementById("updated").textContent =
    "Refreshes every " + data.poll_interval_s + "s · " + data.devices.length + " devices";
}

async function refresh() {
  try {
    const res = await fetch("/api/devices");
    if (!res.ok) throw new Error("HTTP " + res.status);
    render(await res.json());
    wrap.classList.remove("offline");
    document.getElementById("error").textContent = "";
  } catch (err) {
    wrap.classList.add("offline");
    document.getElementById("error").textContent =
      "Could not reach the API (" + err.message + "). Showing the last data received, which is out of date.";
  }
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
