# Real ICMP monitoring (opt-in). Nothing here runs unless you pass this file to netmonlt:
#   netmonlt --inventory config/devices.real.example.yaml
#
# Rules (enforced at startup and again inside the prober):
#   * every device needs `authorized: true`: only list equipment you own or are explicitly
#     permitted to monitor;
#   * each address is ONE IPv4 address or hostname: ranges, CIDR blocks and wildcards are
#     rejected, and nothing is ever scanned or discovered;
#   * `sim:` settings are ignored in real mode;
#   * SNMP interface polling is OFF unless a device has `snmp: {enabled: true, ...}` (see the
#     commented example below). It is SNMPv3 only, and the user name and keys are NEVER written
#     here: they come from environment variables named by `credentials_env`.
#
# To monitor your own devices, copy this file to config/devices.real.yaml (git-ignored).
mode: real
poll_interval_s: 10      # minimum 5 in real mode
# snmp_poll_interval_s: 30   # how often interfaces are polled; default 30, minimum 10
# qos_poll_interval_s: 30    # how often QoS telemetry is read (only if a device enables `qos`);
#                            # default 30, minimum 10
# qos_retention_hours: 24    # how long QoS history is kept (1 to 168)
# Optional: how the Network quality section grades latency, jitter and loss. The defaults are
# shown; they are application-level heuristics, not a QoS standard. Tune them for your links.
# quality:
#   latency_ms: {excellent: 30, good: 80, fair: 150}
#   jitter_ms: {excellent: 5, good: 15, fair: 30}
#   loss_pct: {excellent: 0.5, good: 2, fair: 5}
#   window_s: 900

# Optional, OFF unless enabled: monitor THIS computer's own Wi-Fi link (Windows 11 only for now).
# It only reads the state of the adapter that is already there: it never scans for nearby
# networks, never collects other people's network names and never connects to anything. The
# network name is masked by default and is never written to the log.
# wifi:
#   enabled: true
#   poll_interval_s: 10       # minimum 5
#   backend: auto             # auto (native WLAN API, then netsh), wlanapi or netsh
#   ssid_privacy: masked      # masked (default), full or hidden
#   low_signal_pct: 40        # warn at or below this signal quality (percent) ...
#   warn_after_polls: 3       # ... for this many polls in a row
#   retention_days: 7

# Optional: incident management (acknowledge, investigate and close alerts, with a write-up).
# It is ON by default and needs no configuration; this block only tunes it. It reads the alerts
# NetMonLT already raises and never changes monitoring. Changes are accepted only from the
# machine running NetMonLT.
# incidents:
#   enabled: true                 # false hides the whole feature
#   correlation_window_s: 900     # a fault that returns within this many seconds of recovery
#                                 # joins the same incident (60 to 86400)
#   flapping_recurrences: 2       # this many recurrences mark an incident as flapping
#   operator_actions: false       # OFF by default in real mode (incidents are read-only). Set
#                                 # true to let this machine acknowledge, note and resolve them.

devices:
  # Your own computer over the loopback interface: always safe to try.
  - name: this-machine
    address: 127.0.0.1
    type: host
    authorized: true

  # Example of a device you own (uncomment and edit):
  # - name: home-router
  #   address: 192.168.1.1
  #   type: router
  #   authorized: true

  # The same device with SNMPv3 interface polling switched on. Before starting, set
  #   NETMONLT_SNMP_HOME_ROUTER_USER, NETMONLT_SNMP_HOME_ROUTER_AUTH_KEY and
  #   NETMONLT_SNMP_HOME_ROUTER_PRIV_KEY   (see config/snmp.env.example and the README).
  # - name: home-router
  #   address: 192.168.1.1
  #   type: router
  #   authorized: true
  #   snmp:
  #     enabled: true                          # off unless you say so
  #     credentials_env: NETMONLT_SNMP_HOME_ROUTER   # prefix of the three variables above
  #     security_level: authPriv               # authPriv (default) or authNoPriv
  #     auth_protocol: SHA256                  # SHA, SHA224, SHA256, SHA384 or SHA512
  #     priv_protocol: AES128                  # AES128, AES192 or AES256
  #     port: 161
  #   # OPTIONAL and OFF unless enabled: read-only QoS telemetry (queue, class and drop counters
  #   # the device itself reports). It reuses this device's SNMPv3 settings above, so it needs
  #   # `snmp` enabled and adds no new credentials. Only the adapter below is supported; most
  #   # home routers do not expose QoS counters over SNMP, and such a device will simply show
  #   # "no QoS telemetry". Nothing is scanned or guessed.
  #   qos:
  #     enabled: true
  #     adapter: diffserv-mib                  # DIFFSERV-MIB (RFC 3289); see the README
