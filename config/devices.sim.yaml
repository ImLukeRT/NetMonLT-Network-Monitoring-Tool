# Demo inventory: everything here is simulated, nothing touches the network.
# Addresses are in 192.0.2.0/24 (RFC 5737 "TEST-NET-1"), reserved for documentation,
# so they can never refer to a real host.
mode: simulated
poll_interval_s: 5
# How often the simulated SNMP interface counters are read (real devices: minimum 10).
snmp_poll_interval_s: 10

# How the Network quality section grades each device. These are this application's own
# heuristics, not an industry QoS standard: tune them for the link you monitor. Each figure is
# graded by upper bounds (inclusive): up to `excellent` is Excellent, up to `good` is Good, up to
# `fair` is Fair, above that Poor. A device's grade is the worst of its three figures, and it is
# Unknown when there is too little trustworthy data. These are the built-in defaults.
quality:
  latency_ms: {excellent: 30, good: 80, fair: 150}
  jitter_ms: {excellent: 5, good: 15, fair: 30}
  loss_pct: {excellent: 0.5, good: 2, fair: 5}
  window_s: 900            # default period the summary covers (the dashboard can change it)
  min_checks: 10           # fewer checks in the window: Unknown (insufficient samples)
  min_jitter_pairs: 3      # jitter needs this many pairs of consecutive successful checks
  max_gap_fraction: 0.5    # more of the window than this unmeasured: Unknown (sparse history)

# Wi-Fi signal monitoring of THIS computer's own wireless link. It is opt-in (off unless
# `enabled: true`) and local-only: it never scans for nearby networks or joins one. In this
# simulated demo it shows scripted, deterministic telemetry, clearly labelled as simulated;
# in real mode it would read the real adapter (Windows only, see the README).
wifi:
  enabled: true
  poll_interval_s: 5       # real mode: minimum 5
  ssid_privacy: masked     # masked (default), full or hidden: what is stored and shown
  low_signal_pct: 40       # warn when the signal quality is at or below this ...
  warn_after_polls: 3      # ... for this many polls in a row
  retention_days: 7        # older observations are deleted
  sim:                     # simulated mode only: the scripted link (seconds after start)
    ssid: HomeWiFi
    base_signal_pct: 80
    dip_at_s: 60           # the signal drops to dip_signal_pct ...
    dip_duration_s: 40     # ... for this long (triggers the low-signal warning)
    dip_signal_pct: 25
    disconnect_at_s: 130   # then the link drops entirely ...
    disconnect_duration_s: 20  # ... for this long

devices:
  - name: core-router
    address: 192.0.2.1
    type: router
    sim:
      rtt_ms: 2
      jitter_ms: 0.5
      # Simulated SNMP interface statistics (IF-MIB). Traffic is the average rate in Mbit/s.
      interfaces:
        # The uplink's 64-bit octet counters roll over 75s after start: the rate stays correct.
        - {name: Gi0/1, in_mbps: 180, out_mbps: 60, wrap_at_s: 75}
        - {name: Gi0/2, in_mbps: 25, out_mbps: 8}
        - {name: Gi0/3, status: down}
        # A noisy port: errors and discards accumulate.
        - {name: Gi0/4, in_mbps: 2, out_mbps: 1, in_errors_per_min: 6, in_discards_per_min: 2}

  - name: edge-firewall
    address: 192.0.2.2
    type: firewall
    sim:
      rtt_ms: 4
      jitter_ms: 1
      # The firewall "restarts" 130s after start: its counters and uptime reset, so no rate is
      # shown for one poll instead of a made-up (negative) one. vpn0 vanishes at 100s.
      reboot_at_s: 130
      interfaces:
        - {name: wan0, in_mbps: 50, out_mbps: 12}
        - {name: lan0, in_mbps: 30, out_mbps: 40}
        - {name: vpn0, in_mbps: 5, out_mbps: 5, disappears_at_s: 100}

  - name: access-switch
    address: 192.0.2.10
    type: switch
    # Goes down 30s after startup for 30s, then recovers. SNMP times out during the outage too.
    sim:
      rtt_ms: 3
      jitter_ms: 0.5
      outage_start_s: 30
      outage_duration_s: 30
      interfaces:
        - {name: Fa0/1, in_mbps: 40, out_mbps: 12}
        - {name: Fa0/2, in_mbps: 10, out_mbps: 30}
        - {name: Fa0/24, in_mbps: 90, out_mbps: 70}

  - name: wifi-ap
    address: 192.0.2.20
    type: access-point
    # Lossy radio link: shows up as "degraded".
    sim: {rtt_ms: 18, jitter_ms: 6, loss: 0.4}

  - name: file-server
    address: 192.0.2.30
    type: server
    sim: {rtt_ms: 1, jitter_ms: 0.2}

  - name: branch-vpn
    address: 192.0.2.40
    type: vpn-gateway
    # High latency over a WAN link: also "degraded".
    sim: {rtt_ms: 170, jitter_ms: 15}

  - name: voice-gateway
    address: 192.0.2.50
    type: voip-gateway
    # Low latency but an unsteady one: it is graded Fair because of jitter, not latency or loss.
    sim: {rtt_ms: 15, jitter_ms: 45}
